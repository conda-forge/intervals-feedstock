schema_version: 1

context:
  name: intervals
  version: "0.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c7ee568c583ca857c0d91af6d90ee5e0e8adef3f5646d0076bfb87305ae43090

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - infinity >=0.1.3

tests:
  - python:
      imports:
        - intervals
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license_file: LICENSE
  license: BSD-3-Clause
  summary: Python tools for handling intervals (ranges of comparable objects).
  homepage: https://github.com/kvesteri/intervals
  repository: https://github.com/kvesteri/intervals
  documentation: https://github.com/kvesteri/intervals

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
